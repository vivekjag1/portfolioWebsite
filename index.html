<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vivek Jagadeesh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Crimson+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0e1014;
    --bg-soft: #14171d;
    --panel: #1a1e26;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --fg: #e7e6e1;
    --fg-soft: #b6b3aa;
    --fg-mute: #7c7a72;
    --accent: #7e8a3a;
    --accent-soft: rgba(126,138,58,0.18);

    --serif: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;

    --pad-x: clamp(16px, 5vw, 64px);
    --col: 760px;
    --gap: 28px;
  }

  [data-theme="light"] {
    --bg: #f6f4ef;
    --bg-soft: #efece5;
    --panel: #ffffff;
    --line: rgba(0,0,0,0.10);
    --line-strong: rgba(0,0,0,0.18);
    --fg: #1c1d20;
    --fg-soft: #4a4b4e;
    --fg-mute: #7a7b7e;
    --accent-soft: rgba(47,93,139,0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  html { scroll-behavior: smooth; scroll-padding-top: 88px; }
  body {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.65;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-numeric: oldstyle-nums;
    width: 100%;
    max-width: 100vw;
  }

  ::selection { background: var(--accent-soft); color: var(--fg); }

  /* density modes */
  [data-density="compact"] { --gap: 18px; }
  [data-density="comfy"]   { --gap: 40px; }

  /* type-pair overrides — applied via [data-fontpair] */
  [data-fontpair="poppins"]    { --serif: "Poppins", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace; }
  [data-fontpair="newsreader"] { --serif: "Newsreader", Georgia, serif; --mono: "IBM Plex Mono", monospace; }
  [data-fontpair="fraunces"]   { --serif: "Fraunces", Georgia, serif;   --mono: "JetBrains Mono", monospace; }
  [data-fontpair="crimson"]    { --serif: "Crimson Pro", Georgia, serif;--mono: "IBM Plex Mono", monospace; }
  [data-fontpair="inter"]      { --serif: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", monospace; }

  /* layout shell */
  .shell { max-width: calc(var(--col) + 2 * var(--pad-x)); margin: 0 auto; padding: 0 var(--pad-x); width: 100%; }

  /* ─── NAVBAR ─────────────────────────────────────────────────── */
  .nav-top {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--line);
  }
  .nav-top .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 64px;
    padding: 8px 0;
  }
  .nav-brand {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--fg);
    display: inline-flex; align-items: baseline; gap: 8px;
    text-decoration: none;
  }
  .nav-brand .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); transform: translateY(-1px);
  }
  .nav-links {
    display: flex; gap: 4px; align-items: center;
    font-family: var(--mono); font-size: 12px;
    flex-wrap: wrap;
  }
  .nav-link {
    appearance: none; background: transparent; border: 0; color: var(--fg-mute);
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    font: inherit; letter-spacing: 0.02em; text-transform: lowercase;
    transition: color .15s ease, background .15s ease;
  }
  .nav-link:hover { color: var(--fg); background: var(--bg-soft); }
  .nav-link.is-active { color: var(--accent); }
  .nav-link.is-active::before { content: "/ "; opacity: .6; }

  @media (max-width: 600px) {
    .nav-top .nav-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-height: auto;
    }
    .nav-links { 
      width: 100%;
      justify-content: flex-start;
      font-size: 11px; 
      gap: 2px; 
    }
    .nav-link { padding: 6px 10px; }
  }

  /* floating pill variant */
  [data-nav="pill"] .nav-top {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 32px);
    background: color-mix(in srgb, var(--panel) 86%, transparent);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 0 8px;
  }
  [data-nav="pill"] .nav-top .nav-inner { min-height: 52px; gap: 18px; }
  [data-nav="pill"] body { padding-top: 84px; }
  [data-nav="pill"] { padding-top: 84px; }

  /* left rail variant */
  [data-nav="rail"] .nav-top {
    position: fixed; top: 0; left: 0; bottom: 0; width: 200px;
    border-right: 1px solid var(--line); border-bottom: 0;
    background: var(--bg);
  }
  [data-nav="rail"] .nav-top .nav-inner {
    flex-direction: column; align-items: flex-start; justify-content: flex-start;
    height: auto; padding: 28px 24px; gap: 28px;
  }
  [data-nav="rail"] .nav-links { flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; }
  [data-nav="rail"] .nav-link { width: 100%; text-align: left; }
  [data-nav="rail"] main { margin-left: 200px; }
  [data-nav="rail"] html { scroll-padding-top: 24px; }

  /* ─── SECTIONS ───────────────────────────────────────────────── */
  main section { padding: 56px 0; border-bottom: 1px solid var(--line); }
  main section:last-of-type { border-bottom: 0; }

  .sect-label {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-mute);
    display: flex; align-items: center; gap: 12px;
    margin: 0 0 28px;
  }
  .sect-label::before {
    content: ""; display: inline-block; width: 22px; height: 1px; background: var(--accent);
  }

  /* ─── HERO ───────────────────────────────────────────────────── */
  .hero { 
    display: grid; 
    grid-template-columns: minmax(0, 168px) minmax(0, 1fr); 
    gap: 36px; 
    align-items: start; 
    padding-top: 72px !important; 
  }
  .hero-photo {
    width: 100%;
    max-width: 168px;
    aspect-ratio: 1;
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    position: relative;
  }
  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero-photo .ph-stripes {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 6px, transparent 6px 12px),
      linear-gradient(180deg, var(--bg-soft), var(--panel));
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-mute); font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase;
  }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(28px, 7vw, 46px);
    line-height: 1.08;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
    word-break: break-word;
  }
  .hero h1 em { font-style: normal; font-weight: inherit; color: var(--accent); font-feature-settings: "ss01" 0, "ss02" 0; }
  .hero .role {
    font-family: var(--mono);
    font-size: clamp(11px, 2.5vw, 13px);
    color: var(--fg-soft);
    margin: 0 0 22px;
    letter-spacing: 0.01em;
  }
  .hero p.bio {
    color: var(--fg-soft);
    max-width: 60ch;
    margin: 0 0 20px;
    font-size: clamp(14px, 2.5vw, 16px);
  }
  .hero p.bio a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .hero p.bio a:hover { border-bottom-color: var(--accent); color: var(--accent); }

  .hero-meta {
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
    font-family: var(--mono); font-size: clamp(10px, 2.2vw, 12px); color: var(--fg-mute);
    margin-top: 8px;
  }
  .hero-meta span::before { content: "→ "; color: var(--accent); margin-right: 4px; }

  @media (max-width: 640px) {
    .hero { 
      grid-template-columns: 1fr; 
      gap: 24px; 
      justify-items: center;
      text-align: center;
    }
    .hero-photo { max-width: 132px; margin: 0 auto; }
    .hero > div { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    .hero p.bio { text-align: left; }
    .hero-meta { justify-content: center; }
  }

  /* ─── NEWS ───────────────────────────────────────────────────── */
  .news-list { display: flex; flex-direction: column; gap: var(--gap); }
  .news-item {
    display: grid; grid-template-columns: minmax(0, 96px) minmax(0, 1fr); gap: 20px;
    padding-top: 14px; border-top: 1px dashed var(--line);
  }
  .news-item:first-child { border-top: 0; padding-top: 0; }
  .news-date {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--fg-mute);
    padding-top: 5px;
  }
  .news-body { color: var(--fg-soft); word-break: break-word; }
  .news-body strong { color: var(--fg); font-weight: 500; }
  .news-body a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  .news-body a:hover { border-bottom-style: solid; }
  .news-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 7px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: 1px;
  }

  @media (max-width: 600px) {
    .news-item { grid-template-columns: 1fr; gap: 4px; }
    .news-date { padding-top: 0; }
  }

  /* ─── RESEARCH ───────────────────────────────────────────────── */
  .research-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px;
  }
  .research-card {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 20px;
    background: var(--bg-soft);
    transition: border-color .2s ease, transform .2s ease;
    min-width: 0;
  }
  .research-card:hover { border-color: var(--accent); }
  .research-card .num {
    font-family: var(--mono); font-size: 11px; color: var(--fg-mute); letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .research-card h3 {
    font-family: var(--serif); font-weight: 500; font-size: 18px;
    margin: 0 0 6px; letter-spacing: -0.005em;
  }
  .research-card p {
    margin: 0; font-size: 14px; line-height: 1.55; color: var(--fg-mute);
    font-family: var(--sans);
  }

  /* ─── PROJECTS ───────────────────────────────────────────────── */
  .proj-list { display: flex; flex-direction: column; gap: var(--gap); }
  .proj-item {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px;
    align-items: baseline;
    padding-bottom: var(--gap); border-bottom: 1px dashed var(--line);
  }
  .proj-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .proj-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .proj-head h3 {
    font-family: var(--serif); font-weight: 500; font-size: clamp(18px, 4vw, 22px);
    margin: 0; letter-spacing: -0.005em; line-height: 1.25;
    word-break: break-word;
  }
  .proj-head h3 a { color: var(--fg); text-decoration: none; }
  .proj-head h3 a:hover { color: var(--accent); }
  .proj-year {
    font-family: var(--mono); font-size: 12px; color: var(--fg-mute);
    white-space: nowrap; padding-top: 2px;
  }
  .proj-stack {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 4px;
  }
  .proj-stack code {
    font-family: var(--mono); font-size: 11px;
    color: var(--fg-soft); background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 3px;
  }
  .proj-desc { grid-column: 1 / -1; color: var(--fg-soft); margin: 4px 0 0; max-width: 65ch; }
  .proj-links {
    grid-column: 1 / -1;
    margin-top: 6px;
    display: flex; gap: 18px;
    font-family: var(--mono); font-size: 12px;
    flex-wrap: wrap;
  }
  .proj-links a {
    color: var(--fg-mute); text-decoration: none;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 1px;
  }
  .proj-links a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .proj-links a::before { content: "↗ "; color: var(--accent); margin-right: 2px; }

  @media (max-width: 600px) {
    .proj-item { grid-template-columns: 1fr; }
    .proj-year { padding-top: 0; margin-top: 4px; }
  }

  /* ─── EXPERIENCE ─────────────────────────────────────────────── */
  .work-list { display: flex; flex-direction: column; gap: var(--gap); }
  .work-item {
    display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr); gap: 24px;
    padding-bottom: var(--gap); border-bottom: 1px dashed var(--line);
  }
  .work-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .work-meta { font-family: var(--mono); font-size: 11.5px; color: var(--fg-mute); letter-spacing: 0.04em; padding-top: 4px; line-height: 1.6; }
  .work-meta .where { color: var(--fg-soft); display: block; }
  .work-body h3 {
    font-family: var(--serif); font-weight: 500; font-size: clamp(17px, 3.5vw, 20px);
    margin: 0 0 4px; letter-spacing: -0.005em;
    word-break: break-word;
  }
  .work-body .at { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 8px; display: block; }
  .work-body p { color: var(--fg-soft); margin: 0 0 6px; max-width: 62ch; }
  .work-body ul { color: var(--fg-soft); margin: 6px 0 0; padding-left: 16px; max-width: 62ch; }
  .work-body ul li { margin-bottom: 3px; }
  .work-body ul li::marker { color: var(--accent); }
  @media (max-width: 600px) {
    .work-item { grid-template-columns: 1fr; gap: 6px; }
    .work-meta { padding-top: 0; }
  }

  /* ─── COURSEWORK ─────────────────────────────────────────────── */
  .course-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
    gap: 0;
    border-top: 1px solid var(--line);
  }
  .course {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .course:nth-child(3n) { border-right: 0; }
  @media (max-width: 820px) { .course { border-right: 0 !important; } }
  .course .code {
    font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.06em;
  }
  .course .title { font-size: 15px; color: var(--fg); word-break: break-word; }
  .course .term { font-family: var(--mono); font-size: 11px; color: var(--fg-mute); margin-top: 2px; }

  /* ─── CONTACT ────────────────────────────────────────────────── */
  .contact-wrap {
    display: flex; flex-direction: column; gap: 24px; align-items: stretch;
  }
  .contact-msg {
    font-family: var(--serif); font-size: clamp(18px, 4vw, 22px); line-height: 1.4; color: var(--fg-soft);
    max-width: 100%;
    font-style: italic;
  }
  .contact-msg em { color: var(--accent); font-style: italic; }
  .contact-list { display: flex; flex-direction: column; gap: 0; width: 100%; }
  .contact-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 0; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: clamp(11px, 2.5vw, 13px);
    color: var(--fg);
    text-decoration: none;
    transition: color .15s ease, padding .2s ease;
    gap: 12px;
  }
  .contact-row:last-child { border-bottom: 1px solid var(--line); }
  .contact-row:hover { color: var(--accent); padding-left: 6px; }
  .contact-row .lbl { color: var(--fg-mute); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.14em; }
  .contact-row .val { font-family: var(--mono); word-break: break-word; text-align: right; }
  .contact-row .val::after { content: " ↗"; color: var(--fg-mute); transition: color .15s; margin-left: 6px; }
  .contact-row:hover .val::after { color: var(--accent); }

  /* ─── FOOTER ─────────────────────────────────────────────────── */
  footer.foot {
    padding: 36px 0 60px;
    font-family: var(--mono); font-size: 11px; color: var(--fg-mute);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  footer.foot a { color: var(--fg-mute); text-decoration: none; }
  footer.foot a:hover { color: var(--accent); }

  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body data-theme="dark" data-density="regular" data-fontpair="inter" data-nav="top">
  <div id="root"></div>

      <rect x="56" y="118" width="88" height="6" rx="3" fill="#e7e6e1"/>
      <rect x="68" y="134" width="64" height="4" rx="2" fill="#7e8a3a" opacity="0.7"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script type="text/babel" src="app.jsx"></script>
</body>
